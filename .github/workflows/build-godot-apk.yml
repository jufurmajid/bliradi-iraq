name: Build Briyaldo Godot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: godot
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already provide the Android SDK and sdkmanager.
      - name: Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true
      - name: Generate temporary debug keystore
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/briyaldo-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Android Debug,O=Android,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/briyaldo-debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Import project and verify Godot scripts
        run: |
          godot --headless --path . --import --quit
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/briyaldo-iraq-debug.apk
          test -s build/briyaldo-iraq-debug.apk
          ls -lh build/briyaldo-iraq-debug.apk
      - name: Downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Briyaldo-Iraqi-Godot-Android-APK
          path: godot/build/briyaldo-iraq-debug.apk
          if-no-files-found: error
