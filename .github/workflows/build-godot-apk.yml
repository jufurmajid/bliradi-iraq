name: Build Briyaldo Godot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: godot
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already provide the Android SDK and sdkmanager.
      - name: Android build tools
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true
      - name: Generate temporary debug keystore
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/briyaldo-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Android Debug,O=Android,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/briyaldo-debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Configure Godot Android editor paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import project and verify Godot scripts
        run: |
          godot --headless --path . --import --quit 2>&1 | tee /tmp/briyaldo-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/briyaldo-import.log; then
            exit 1
          fi
      - name: Check Android-sized menu layout
        run: |
          godot --headless --path . --script res://tests/menu_layout.gd 2>&1 | tee /tmp/briyaldo-layout.log
          grep -q MENU_LAYOUT_OK /tmp/briyaldo-layout.log
      - name: Smoke test native game launch
        run: |
          godot --headless --path . --quit-after 40 2>&1 | tee /tmp/briyaldo-smoke.log
          if grep -E 'SCRIPT ERROR:|Invalid call\\.|Attempt to call|ERROR:.*script' /tmp/briyaldo-smoke.log; then
            exit 1
          fi
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/briyaldo-iraq-debug.apk
          test -s build/briyaldo-iraq-debug.apk
          ls -lh build/briyaldo-iraq-debug.apk
      - name: Downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Briyaldo-Iraqi-Godot-Android-APK
          path: godot/build/briyaldo-iraq-debug.apk
          if-no-files-found: error
      - name: Publish external APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/briyaldo-iraq-debug.apk build/briyaldo-iraq-v0.1.1-debug.apk
          TAG=v0.1.1-ui-fix
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/briyaldo-iraq-v0.1.1-debug.apk --clobber
          else
            gh release create "$TAG" build/briyaldo-iraq-v0.1.1-debug.apk \
              --target "$GITHUB_SHA" \
              --title 'بريالدو العراقي v0.1.1 — إصلاح شاشة البداية' \
              --notes 'نسخة تجريبية للأندرويد: إصلاح انضغاط نصوص القائمة بشكل عمودي، تحسين توزيع الواجهة على الشاشة، والاحتفاظ بطور اللعب ضد الكمبيوتر.'
          fi
